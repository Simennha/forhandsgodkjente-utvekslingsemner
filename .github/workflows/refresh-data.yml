name: Oppdater utvekslingsdata

on:
  schedule:
    # Mandager kl. 05:00 UTC (06:00/07:00 norsk tid)
    - cron: '0 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer avhengigheter
        run: pip install beautifulsoup4

      - name: Hent nye data fra NTNU-wikien og bygg siden på nytt
        run: python skill/ntnu-indok-emner/refresh_data.py

      - name: Commit og push hvis noe har endret seg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if git diff --cached --quiet; then
            echo "Ingen endringer i dataene."
          else
            git commit -m "Automatisk oppdatering av utvekslingsdata ($(date -u +%Y-%m-%d))"
            git push
          fi
