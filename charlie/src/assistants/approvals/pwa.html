<!doctype html><html lang="nb"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Godkjenning</title>
<style>body{font-family:system-ui;margin:16px;max-width:560px}pre{white-space:pre-wrap;
background:#f4f4f4;padding:12px;border-radius:8px}button{font-size:1.1em;padding:10px 16px}</style>
</head><body><h1>Godkjenning</h1><p>Lim inn forslags-ID eller åpne lenken fra varselet.</p>
<input id="pid" size="40"><button onclick="load()">Vis</button><pre id="text"></pre>
<button id="ok" onclick="approve()" disabled>Godkjenn med passkey</button><p id="out"></p>
<script>
async function load(){const r=await fetch('/requests/'+pid.value);const d=await r.json();
text.textContent=d.text||d.detail;ok.disabled=!d.text;window.req=d;}
async function approve(){const d=window.req;
const ch=Uint8Array.from(atob(d.webauthn_challenge.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const a=await navigator.credentials.get({publicKey:{challenge:ch,rpId:d.rp_id,userVerification:'required'}});
const enc=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const cred={id:a.id,rawId:enc(a.rawId),type:a.type,response:{clientDataJSON:enc(a.response.clientDataJSON),
authenticatorData:enc(a.response.authenticatorData),signature:enc(a.response.signature)}};
const r=await fetch('/requests/'+d.proposal_id+'/approve',{method:'POST',headers:{'content-type':'application/json'},
body:JSON.stringify({method:d.method,evidence_b64:btoa(JSON.stringify(cred))})});out.textContent=JSON.stringify(await r.json());}
</script></body></html>
