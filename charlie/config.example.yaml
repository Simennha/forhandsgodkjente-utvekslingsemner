# Example configuration. Copy to config.yaml and edit. ALL numbers below are obviously fake.
# Secrets are NOT stored here - see .env.example and `make secrets`.

locale:
  country: "NO"
  language: nb
  timezone: Europe/Oslo

llm:
  backend: mock               # mock | anthropic
  router_model: claude-haiku-5-5
  hard_model: claude-sonnet-5-5
  lola_model: claude-haiku-5-5
  extractor_model: claude-haiku-5-5
  usd_to_nok: 10.8            # update monthly; used for real cost accounting
  prices_usd_per_mtok:        # first-party API list prices (cached 2026-10-06)
    claude-haiku-5-5:  {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
    claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  max_tokens: {router: 1024, hard: 4096, lola: 512, extractor: 1024}

budgets:                      # hard caps; agent pauses when reached
  charlie: {daily_nok: 100, monthly_nok: 1500}
  lola:    {daily_nok: 20,  monthly_nok: 300}

orders:
  level3_single_max_nok: 5000   # above this an approval box is required
  monthly_max_nok: 50000        # never exceeded, not even with the box

approvals:
  passkey_ttl_s: 300
  box_ttl_s: 600
  approval_box_tools: []        # tools that ALWAYS need the box (in addition to large orders)
  rp_id: charlie.local
  rp_name: Charlie godkjenning

rate_limits:
  gateway_per_number_per_hour: 30
  gateway_unknown_per_hour: 10
  pin_attempts_before_lockout: 3
  pin_lockout_s: 900
  tool_calls_per_hour:
    default: 60
    email.send: 10
    inventory.order: 5
    calendar.invite: 10
    house.door_lock_set: 6
    guest.queue_request: 20
    guest.take_message: 20

identity:
  owner_numbers: ["+4700000001"]          # FAKE. Your own mobile number(s).
  second_alarm_number: "+4700000009"      # FAKE. Gets silent alarm on duress.
  charlie_number: "+4700000100"           # FAKE. Charlie's Twilio number.
  lola_number: "+4700000200"              # FAKE. Lola's Twilio number.
  killswitch_number: "+4700000300"        # FAKE. Secret number on the kill switch SIM.
  known_contacts: ["+4700000002", "+4700000003"]

killswitch:
  pause_window_s: 120
  unknown_rings_to_pause: 2
  known_rings_to_pause: 1
  stop_window_s: 600
  rings_to_stop: 3
  physical_switch_action: STOPPED
  lease_ttl_s: 30
  max_rings_tracked: 256
  anomaly_rules:
    - {name: many-denials, kind: denied_burst, threshold: 10, window_s: 300, action: PAUSED}
    - {name: level4-attempts, kind: level4_attempt, threshold: 3, window_s: 600, action: PAUSED}
    - {name: pin-bruteforce, kind: pin_failures, threshold: 6, window_s: 3600, action: PAUSED}
    - {name: cost-spike, kind: cost_spike, threshold: 30, window_s: 600, action: PAUSED}   # NOK in 10 min

workshop:
  wake_words: [charlie]
  open_workshop:
    allow_phone_stt: false    # safest: no speech-to-text at all in open workshop mode

transcripts:
  raw_retention_days: 7

heartbeat:
  stale_after_s: 120

house:
  lights: [light.stue, light.kjokken]
  climate: [climate.stue]
  locks: [lock.inngang]
  workshop_lights: [light.verksted_tak, light.verksted_benk]
  workshop_sensors: [sensor.verksted_temp, sensor.verksted_fukt, sensor.verksted_co2]
  min_temp_c: 5
  max_temp_c: 25

action_tokens:
  ttl_s: 60
